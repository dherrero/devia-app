<dv-ai-bubble>
  <div class="dv-working-badge">
    <span class="dv-pulse-dot" aria-hidden="true"></span>
    {{ label() }}
  </div>
  <div class="dv-typing-dots" role="status" [attr.aria-label]="ariaLabel()">
    <span class="dv-dot dv-dot--1"></span>
    <span class="dv-dot dv-dot--2"></span>
    <span class="dv-dot dv-dot--3"></span>
  </div>
</dv-ai-bubble>
