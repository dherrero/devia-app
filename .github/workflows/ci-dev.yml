name: CI (dev)

# Lightweight gate for the dev consolidation branch: types, lint and unit
# tests only. The full pipeline (coverage, production build, dependency audit)
# runs in ci.yml when dev is merged into main, to save CI minutes.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Dev · Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:main
      - run: npm run test:renderer
      - run: npm run test:libs
