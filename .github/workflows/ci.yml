name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx nx run desktop:typecheck
      - run: npx nx run desktop:lint
      - run: npx nx run desktop:test:coverage
      - run: npx nx run desktop:test:renderer
      - run: npx nx run desktop:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-coverage
          path: apps/desktop/coverage/
          retention-days: 7

  audit:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node scripts/audit-runtime.mjs
