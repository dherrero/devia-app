name: 🏷️ Release

on:
  push:
    branches: [main]

# Default: read-only. Write is granted ONLY to the release job below, and the
# token is never persisted in the local git config (see persist-credentials).
permissions:
  contents: read

jobs:
  release:
    name: 🏷️ Version & Release
    runs-on: ubuntu-latest
    # Skip version bump commits pushed by this same workflow
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Never leave the token in the local git config: any lifecycle
          # script of any dependency could otherwise reuse it to push to main.
          persist-credentials: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # ── Determine bump type from the commits pushed ───────────────────────────
      # feat!: / fix!: / feat(<scope>)!: → MAJOR
      # feat:  / feat(<scope>):          → MINOR
      # fix:   / fix(<scope>):           → PATCH
      # anything else                    → no release
      #
      # We inspect EVERY commit introduced by this push (range before..after),
      # NOT just HEAD, and skip merge commits. A dev→main delivery commonly lands
      # as a merge commit whose subject ("Merge ...") matches no convention; if we
      # only looked at HEAD the whole delivery would resolve to "none" and never
      # publish. The highest-precedence bump among the real commits wins.
      - name: 🔍 Determine bump type
        id: bump
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            MSGS=$(git log --no-merges --pretty=%s "${BEFORE}..${AFTER}")
          else
            # First push / unknown base: fall back to HEAD only.
            MSGS=$(git log -1 --no-merges --pretty=%s "$AFTER")
          fi
          echo "Commits inspected:"; printf '%s\n' "$MSGS"
          MAJOR=0; MINOR=0; PATCH=0
          while IFS= read -r MSG; do
            [ -z "$MSG" ] && continue
            if echo "$MSG" | grep -qE '^(feat|fix)(\(.+\))?!:'; then MAJOR=1
            elif echo "$MSG" | grep -qE '^feat(\(.+\))?:'; then MINOR=1
            elif echo "$MSG" | grep -qE '^fix(\(.+\))?:'; then PATCH=1
            fi
          done <<< "$MSGS"
          if [ "$MAJOR" = 1 ]; then TYPE=major
          elif [ "$MINOR" = 1 ]; then TYPE=minor
          elif [ "$PATCH" = 1 ]; then TYPE=patch
          else TYPE=none; fi
          echo "Resolved bump: $TYPE"
          echo "type=$TYPE" >> $GITHUB_OUTPUT

      - name: 🔢 Bump package version
        if: steps.bump.outputs.type != 'none'
        # --ignore-scripts: no project/dependency hook may run on this
        # privileged runner before the push step.
        run: npm version ${{ steps.bump.outputs.type }} --no-git-tag-version --ignore-scripts

      - name: 📌 Read new version
        if: steps.bump.outputs.type != 'none'
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 📝 Commit, tag & push
        if: steps.bump.outputs.type != 'none'
        # The GITHUB_TOKEN is injected only here, via the remote URL of this
        # single push — it never lands in the git config.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.version.outputs.value }} [skip ci]"
          git tag v${{ steps.version.outputs.value }}
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main --follow-tags

      - name: 🚀 Create GitHub Release
        if: steps.bump.outputs.type != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
