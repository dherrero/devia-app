<div class="ds-mode-bar__group" role="group">
  @for (option of options; track option.id) {
    <button type="button"
            class="ds-mode-bar__seg"
            [class.ds-mode-bar__seg--warn]="option.tone === 'danger'"
            [attr.data-active]="mode() === option.id ? 'true' : null"
            [attr.aria-pressed]="mode() === option.id"
            [dvTooltip]="option.tooltipKey | translate"
            [attr.aria-label]="option.labelKey | translate"
            (click)="onSelect(option)">
      <span>{{ option.labelKey | translate }}</span>
    </button>
  }
</div>
<!-- Right slot: chat panel projects the quick-actions toggle + chips here so
     they share this row, pushed to the right edge. -->
<span class="ds-mode-bar__end"><ng-content /></span>
